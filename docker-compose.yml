version: '3.8'

services:
  bus-service:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    environment:
      - NODE_ENV=production
      - PORT=8008
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/bus_service}
    depends_on:
      - mongodb
    networks:
      - bus-network
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - bus-network

volumes:
  mongodb_data:

networks:
  bus-network:
    driver: bridge